<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

  <title>KuponLab</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KuponLab">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="theme-color" content="#06111f">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #06111f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #06111f;
      color: white;
    }

    .brand {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .green {
      color: #32e67f;
    }

    .subtitle {
      margin-top: 14px;
      color: #91a2b4;
      font-size: 17px;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin-top: 35px;
      border: 4px solid #183247;
      border-top-color: #32e67f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    window.onload = function () {
      setTimeout(function () {
        window.location.replace("https://kuponlab.streamlit.app/");
      }, 700);
    };
  </script>

</head>

<body>

  <div class="screen">

    <div class="brand">
      ⚽ Kupon<span class="green">Lab</span>
    </div>

    <div class="subtitle">
      Maçı değil, veriyi oyna.
    </div>

    <div class="loader"></div>

  </div>

</body>
</html>
