<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KuponLab</title>
<meta name="theme-color" content="#020d1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KuponLab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/KuponLab-iPhone/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/KuponLab-iPhone/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/KuponLab-iPhone/icons/icon-192.png">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020d1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#wrap{position:fixed;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;background:#020d1b}
iframe{width:100%;height:100%;border:0;display:block;background:#020d1b}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(145deg,#020d1b,#07352a 60%,#031a22);color:white;transition:opacity .3s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:118px;height:118px;object-fit:contain;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
#splash h1{margin:0;font-size:2rem;font-weight:900}
#splash p{margin:0;color:#a7b4c4}
.dot{width:9px;height:9px;border-radius:50%;background:#20f39a;animation:p 1s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(.75);opacity:.45}50%{transform:scale(1.3);opacity:1}}
</style>
</head>
<body>
<div id="splash">
  <img src="/KuponLab-iPhone/icons/icon-192.png" alt="KuponLab">
  <h1>KuponLab</h1>
  <p>Maçı değil, veriyi oyna.</p>
  <div class="dot"></div>
</div>
<div id="wrap">
  <iframe id="app" src="https://kuponlab.streamlit.app/?embed=true" title="KuponLab" allow="clipboard-read; clipboard-write"></iframe>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/KuponLab-iPhone/sw.js', {scope:'/KuponLab-iPhone/'}).catch(()=>{});
  });
}
const splash=document.getElementById('splash');
document.getElementById('app').addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),500));
</script>
</body>
</html>
