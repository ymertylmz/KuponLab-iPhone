<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

  <title>KuponLab</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KuponLab">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020d1b">

  <link rel="apple-touch-icon" href="./kuponlab_logo.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #020d1b;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .splash {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #06271f 0%,
          #020d1b 52%,
          #010812 100%
        );
    }

    .logo {
      width: 78%;
      max-width: 430px;
      border-radius: 28px;
      display: block;
    }

    .loader {
      width: 130px;
      height: 5px;

      margin-top: 35px;

      border-radius: 20px;
      overflow: hidden;

      background: rgba(255,255,255,.12);
    }

    .loader span {
      display: block;

      width: 45%;
      height: 100%;

      border-radius: 20px;

      background: #20e98b;

      animation: loading 0.9s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(280%);
      }
    }
  </style>
</head>

<body>

  <div class="splash">

    <img
      class="logo"
      src="./kuponlab_logo.png"
      alt="KuponLab"
    >

    <div class="loader">
      <span></span>
    </div>

  </div>

  <script>
    setTimeout(function () {
      window.location.replace(
        "https://kuponlab.streamlit.app/"
      );
    }, 1400);
  </script>

</body>
</html>
