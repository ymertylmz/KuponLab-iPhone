<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover">

  <title>KuponLab</title>

  <!-- iPHONE UYGULAMA AYARLARI -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KuponLab">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020d1b">

  <!-- ANA EKRAN LOGOSU -->
  <link rel="apple-touch-icon" sizes="180x180" href="./kuponlab_logo.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020d1b;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px 25px;

      background:
        radial-gradient(circle at 50% 35%, #07352a 0%, #031a22 28%, #020d1b 62%);
    }

    .logo {
      width: min(82vw, 430px);
      border-radius: 28px;
      display: block;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .button {
      width: min(82vw, 430px);

      margin-top: 32px;
      padding: 18px 20px;

      border: 0;
      border-radius: 18px;

      background: linear-gradient(135deg, #13d878, #20f39a);

      color: #00150d;
      font-size: 19px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;

      box-shadow: 0 10px 35px rgba(32,243,154,.20);

      cursor: pointer;
    }

    .button:active {
      transform: scale(.98);
    }

    .text {
      margin-top: 18px;
      color: #8393a7;
      font-size: 13px;
      text-align: center;
    }

  </style>
</head>

<body>

  <main class="app">

    <img
      class="logo"
      src="./kuponlab_logo.png"
      alt="KuponLab"
    >

    <a
      class="button"
      href="https://kuponlab.streamlit.app/"
    >
      ⚽ KUPONLAB'I AÇ
    </a>

    <div class="text">
      Maçı değil, veriyi oyna.
    </div>

  </main>

</body>
</html>
